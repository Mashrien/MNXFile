name: Windows native build
on: [pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  win-x64:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test the managed engine, native DLL and clients
        shell: pwsh
        run: |
          $env:MNXBuildNumber = (Get-Content BuildNumber.txt).Trim()
          $env:MNXReleaseRoot = Join-Path $env:RUNNER_TEMP 'release'
          ./build.ps1 -Runtime win-x64 -Test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mnxfile-win-x64
          path: ${{ runner.temp }}/release/win-x64/
          if-no-files-found: error
